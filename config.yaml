seed: 42

dataset:
  hf_name: openai/openai_humaneval
  split: test
  output: data/samples_v1.jsonl
  n_tasks: 100          # each task -> 1 correct + 1 buggy sample
  max_mutant_tries: 5   # mutants tested per (task, operator) before giving up

sandbox:
  timeout_s: 10

prompts: [neutral_v1, adversarial_v1]

reviewers:
  ollama:
    url: http://localhost:11434
    model: qwen3.5:9b
    think: false        # Qwen3.5 thinking mode off; any <think> block is stripped anyway
    num_ctx: 8192
    num_predict: 8192   # output cap: some prompts make Qwen loop forever; max seen before the cap was 7777
    timeout_s: 600
    concurrency: 1
  gemini:
    model: gemini-3.8-flash   # gemini-2.5-flash is deprecated (checked docs 2026-11-24)
    thinking_level: low       # lowest level this model allows; thinking cannot be fully off
    usd_per_mtok_input: 0.75  # paid-tier list price, for cost comparison (free tier is not charged)
    usd_per_mtok_output: 3.75 # includes thinking tokens; price rises on 2027-01-01
    concurrency: 2
    max_cost_usd: 2.0         # hard budget per run directory (list-price estimate); runner stops gemini here
  gemini-lite:
    adapter: gemini
    model: gemini-3.5-flash-lite  # stable; cheaper 3.1-flash-lite has no status label (checked docs 2026-11-25)
    thinking_level: minimal       # lowest level this model allows
    usd_per_mtok_input: 0.30
    usd_per_mtok_output: 2.50
    concurrency: 2
    max_cost_usd: 1.0
  gemini-argon:
    adapter: gemini
    model: gemini-4-argon         # stable, large Gemini 4 model (checked docs 2026-11-25)
    thinking_level: low           # lowest level this model allows
    usd_per_mtok_input: 2.00      # intro price through 2026-11-30; $4.00 from 2026-12-01
    usd_per_mtok_output: 10.00    # intro price through 2026-11-30; $20.00 from 2026-12-01
    concurrency: 2
    max_cost_usd: 1.0             # per run dir; 3 run dirs -> at most $3 (credit left: ~165 TRY)
  claude:
    model: claude-sonnet-5-5  # full id, not the alias: the logged model must not change silently
    effort: low               # lowest; Sonnet still thinks briefly on some calls (~80 tokens), logged as thinking=true
    timeout_s: 300
    concurrency: 2

natural:
  output: data/natural_plus_v1.jsonl  # samples (failing -> natural bug, passing -> correct)
  tests_hf_name: evalplus/humanevalplus  # stricter tests; HumanEval's own tests found only 1 failing solution
  test_timeout_s: 30                 # HumanEval+ tests are large (slowest canonical run: 9.3 s)
  exclude: [HumanEval/32]            # its HumanEval+ test fails on the canonical solution (broken in this version)
  raw: data/natural_v1_raw.jsonl      # cached writer outputs (never re-paid)
  writer:
    model: claude-sonnet-5-5          # same model as the claude reviewer (same-model question)
    effort: low
    timeout_s: 300
    concurrency: 2

natural_mbpp:            # python -m reviewbench build-natural --source mbpp
  hf_name: evalplus/mbppplus          # 378 tasks; prompt = task sentence + first example assert (evalplus format)
  output: data/natural_mbpp_v1.jsonl
  raw: data/natural_mbpp_v1_raw.jsonl
  test_timeout_s: 60                  # slowest canonical run: 33.5 s with 6 parallel runs
  exclude: [Mbpp/590]                 # canonical fails its own test (float precision)
  balance: true                       # all natural bugs + the same number of passing solutions (seed)
  writer:
    model: claude-sonnet-5-5
    effort: low
    timeout_s: 300
    concurrency: 2
    prompt: writer_mbpp_v1

review:                  # python -m reviewbench review <file>
  prompt: neutral_v1     # adversarial did not raise catch rate significantly (McNemar), see README
  results:               # run dirs whose calls rank the reviewers by F1 (same prompt, same model as above)
    - results/ollama-full-v1
    - results/gemini-full-v1
    - results/claude-full-v1
    - results/natural-plus-v1
    - results/natural-mbpp-v1
  fallback: [gemini, ollama, claude]  # order when no results match an available reviewer
