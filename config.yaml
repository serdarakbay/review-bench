seed: 42

dataset:
  hf_name: openai/openai_humaneval
  split: test
  output: data/samples_v1.jsonl
  n_tasks: 100          # each task -> 1 correct + 1 buggy sample
  max_mutant_tries: 5   # mutants tested per (task, operator) before giving up

sandbox:
  timeout_s: 10

prompts: [neutral_v1, adversarial_v1]

reviewers:
  ollama:
    url: http://localhost:11434
    model: qwen3.5:9b
    think: false        # Qwen3.5 thinking mode off; any <think> block is stripped anyway
    num_ctx: 8192
    timeout_s: 600
